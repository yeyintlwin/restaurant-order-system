# The repository-root Compose file (spec 9.0). .github/workflows/deploy.yml copies it
# to ~/restaurant-order-system/docker-compose.yml on every push.
networks:
  core-net:

services:
  core-db:
    # Pinned to a MAJOR: an unpinned tag eventually pulls 17, which refuses to start
    # against a PGDATA written by 16 and presents as a total outage at 22:00.
    image: postgres:16-alpine
    container_name: core-db
    restart: unless-stopped
    # NOT on the default network (spec 9.2). epaper-hub is internet-facing and
    # authenticates on req.query.api_key; core_api_owner reachable from it is
    # `COPY ... TO PROGRAM`, i.e. a shell inside this container.
    networks: [core-net]
    # NO `ports:` KEY AT ALL -- not even a loopback-only publish, which differs from a
    # public one by a single deletion. Docker installs published ports as DNAT rules
    # in the nat table, evaluated BEFORE ufw's filter chains, so a published port
    # bypasses ufw. Nothing needs one: core-api reaches this over core-net, and
    # psql/pg_dump go through `docker compose exec`.
    env_file:
      - ${CORE_ENV_FILE:-.env}
    environment:
      POSTGRES_USER: core_api_owner
      POSTGRES_DB: core
      POSTGRES_INITDB_ARGS: "--data-checksums --encoding=UTF8"
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: UTC
    command:
      - postgres
      - -c
      - max_connections=40
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      # Phase 1's largest table holds a few dozen rows; each parallel worker is a
      # memory spike, and the OOM killer is the named top risk on this box.
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - timezone=UTC
      # ADVISORY-LOCK ORPHAN FIX: the default keepalive idle is 2 hours, so a
      # SIGKILLed core-api holding the migration lock blocks every deploy for that
      # long. 20 + 5*3 = ~35 s, comfortably inside the runner's 60 s bounded retry.
      - -c
      - tcp_keepalives_idle=20
      - -c
      - tcp_keepalives_interval=5
      - -c
      - tcp_keepalives_count=3
    volumes:
      - core-db-data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 IS LOAD-BEARING: during initdb the entrypoint runs a temporary
      # server on the unix socket only, so a socket pg_isready reports healthy while
      # TCP is still refused and Compose starts core-api against nothing.
      test: ["CMD-SHELL", "pg_isready -U core_api_owner -d core -h 127.0.0.1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Let Postgres checkpoint instead of being SIGKILLed after the default 10 s.
    stop_grace_period: 60s
    shm_size: 128mb
    # Bias the kernel AWAY from the process holding the data.
    oom_score_adj: -500

  core-api:
    image: ${CORE_API_IMAGE:-core-api}
    container_name: core-api
    restart: unless-stopped
    networks: [core-net, default]
    ports:
      # The "not exposed past Nginx" property is delivered HERE, not by HOST: a
      # process bound to 127.0.0.1 INSIDE a container is unreachable from
      # docker-proxy and from the Compose network, so HOST is 0.0.0.0 by design.
      - "127.0.0.1:3200:3200"
    env_file:
      - ${CORE_ENV_FILE:-.env}
    environment:
      PORT: 3200
      HOST: 0.0.0.0
      TZ: UTC
      # The origin BROWSERS use for cookie-authenticated requests, which is the admin
      # app -- it serves the UI and proxies /api, so core-api only ever sees requests
      # whose Origin is this. api.yeyintlwin.com keeps answering for terminal and
      # service callers, which authenticate by bearer and are exempt from the Origin
      # check entirely (spec 5.3).
      API_PUBLIC_ORIGIN: https://admin.yeyintlwin.com
      # Empty means no CORS headers are emitted at all -- the Phase-1 default; the
      # OPTIONS responder ships inert.
      TERMINAL_ALLOWED_ORIGINS: ""
      TRUSTED_PROXY_HOPS: 1
      # Spec 11.7: core-api is the ONLY permitted caller of the e-paper SDK, so this
      # service -- not customer-order -- is the one that reaches the hub. Both endpoints
      # sit on the `default` bridge; core-api is the only service on BOTH networks, which
      # is what lets it hold core-net and still talk to the hub.
      #
      # Its two CREDENTIALS are deliberately not here. EPAPER_API_KEY and
      # TABLE_DISPLAY_SERVICE_TOKEN come from ${CORE_ENV_FILE} (~/core-api.env, mode 600)
      # like every other secret this service reads: this file is committed, and
      # `docker compose config` interpolates env_file contents but prints THIS block
      # verbatim to anyone who runs it on the box.
      EPAPER_HUB_URL: http://epaper-hub:3000
      SESSION_IDLE_SECONDS: 28800
      SESSION_ABSOLUTE_SECONDS: 604800
      PAIRING_CODE_TTL_SECONDS: 900
      TERMINAL_TOKEN_TTL_SECONDS: 7776000
      LOGIN_RATE_PER_MINUTE: 30
      LOGIN_TIME_BUDGET_MS: 400
      SCRYPT_SLOTS: 2
      PAIR_RATE_PER_MINUTE: 20
      ADMIN_MINT_RATE_PER_10MIN: 20
      PAIRING_MINT_RATE_PER_10MIN: 30
      PASSWORD_ABUSE_THRESHOLD: 5
      ROTATE_RATE_PER_HOUR: 5
      AUDIT_RETENTION_DAYS: 365
      # The mount point below, spelled once here and once in `volumes:`. Under
      # /var/lib because it is state this service OWNS and that must survive a
      # redeploy -- the image is replaced on every push and anything written
      # inside it goes with the old container.
      LOGO_ROOT: /var/lib/core-api/logos
      DB_POOL_MAX: 8
    volumes:
      # THE LOGO FILES. A named volume, not a bind mount: nothing on the host needs
      # to read these, and a bind mount would put the container's uid in charge of a
      # host directory's permissions on every deploy.
      #
      # The name says which service owns it and what is in it, the way core-db-data
      # does -- `docker volume ls` on the box is read by somebody deciding what is
      # safe to remove, and `data` would tell them nothing.
      - core-api-logos:/var/lib/core-api/logos
    depends_on:
      core-db:
        condition: service_healthy
    healthcheck:
      # /health, NOT /health/ready. Nothing depends_on core-api, so an unhealthy mark
      # would restart nothing, and a transient database blip should not produce a
      # misleading container status. The DEPLOY GATE is what calls /health/ready.
      #
      # 127.0.0.1, NEVER the hostname form: /etc/hosts in this image maps that name to
      # ::1 ONLY, and this service sets HOST=0.0.0.0, which is IPv4-only. The probe
      # therefore dialled [::1]:3200 and was refused on every run -- the container sat
      # unhealthy from its first deploy while /health answered 200 the whole time.
      # epaper-hub survives the same form only because it sets no HOST and Node binds
      # dual-stack; that is luck, not a pattern to copy. Same class as core-db's
      # `-h 127.0.0.1` above.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3200/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 512m
    # The OOM killer is the named top risk on a 1 GB box: bias it toward the
    # restartable app containers and away from core-db, which holds the data.
    oom_score_adj: 500

  epaper-hub:
    image: ${EPAPER_IMAGE:-epaper-hub}
    # NOT `build: .`. A relative build context resolves against the directory of THIS
    # file, which is now the repository root; apps/epaper-hub/Dockerfile copies
    # package*.json and server.js relative to its own directory, so a rooted context
    # would copy the workspace package.json and then fail on `COPY server.js`.
    # Production is unaffected (--no-build) and `docker compose config` still prints
    # ok, so only the test sees this.
    build:
      context: apps/epaper-hub
    container_name: epaper-hub
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ${EPAPER_ENV_FILE:-.env}
    environment:
      SCREEN_STORE_FILE: /data/screens.json
    volumes:
      - epaper-data:/data
    healthcheck:
      # LEFT AS THE HOSTNAME FORM DELIBERATELY, and it is not the same as core-api's.
      # This service binds dual-stack (`:::3000`), so ::1 answers and the probe passes --
      # verified on the box, along with 127.0.0.1 answering on the same socket. It works
      # because this service sets no HOST; set one to 0.0.0.0 and it breaks exactly the
      # way core-api's did, silently. Not changed here because
      # apps/epaper-hub/test/deploy-config.test.js:63 pins this literal and that suite
      # belongs to the hub area, not to Plan 5 (see this plan's File ownership table).
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    oom_score_adj: 500

  customer-order:
    image: ${CUSTOMER_ORDER_IMAGE:-customer-order}
    container_name: customer-order
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    env_file:
      - ${EPAPER_ENV_FILE:-.env}
    environment:
      PORT: 3100
      # Spec 11.7: this app no longer holds the e-paper SDK and no longer speaks to the
      # hub at all. It asks core-api to update a table, and core-api calls the SDK. So
      # EPAPER_HUB_URL moved to the core-api block above and this replaces it.
      #
      # Reachable because core-api declares `networks: [core-net, default]` -- it is the
      # only service on both, and this one is on `default` implicitly. The bearer it
      # presents (TABLE_DISPLAY_SERVICE_TOKEN) is a secret and comes from
      # ${EPAPER_ENV_FILE}, not from this committed file.
      CORE_API_URL: http://core-api:3200
      ORDER_BASE_URL: https://order.yeyintlwin.com
      BUSINESS_TIME_ZONE: Asia/Tokyo
      BUSINESS_DAY_ROLLOVER_HOUR: 6
    depends_on:
      # STILL the hub, not core-api. The dependency is about the DISPLAY being ready
      # before this app tries to reset twelve of them at startup, and the hub is what
      # owns the panels; core-api is now a hop on the way there. Adding
      # `core-api: service_healthy` here would also put a database migration in front of
      # the customer ordering page, which is a much larger blast radius for a page that
      # otherwise needs nothing from core-net.
      epaper-hub:
        condition: service_healthy
    oom_score_adj: 500

  admin-management:
    image: ${ADMIN_MANAGEMENT_IMAGE:-admin-management}
    container_name: admin-management
    restart: unless-stopped
    ports:
      - "127.0.0.1:3400:3400"
    # Deliberately NO env-file key and no credential of any kind. This app serves
    # files and forwards requests; everything that needs a secret is behind it.
    # Hyphenated on purpose: public-ui.test.js greps this block for the underscored
    # key and cannot tell a declaration from a mention of one in prose.
    environment:
      PORT: 3400
      # By service name over the `default` bridge. It does NOT go out through nginx
      # and back in: that would put a second TLS handshake and a second proxy hop on
      # every API call, and the hop would change what core-api counts.
      CORE_API_URL: http://core-api:3200
    depends_on:
      core-api:
        condition: service_healthy
    oom_score_adj: 500

volumes:
  epaper-data:
  core-db-data:
  # Company and branch marks. Each file is named after the SHA-256 of its own
  # bytes, so the same picture used by two companies is one file here, and a file
  # nothing points at any more is deleted when the record that pointed at it
  # changes. Losing this volume loses every logo and nothing else -- the rows
  # survive and each one says which file it wants.
  core-api-logos:
