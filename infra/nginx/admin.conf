# admin.yeyintlwin.com -- the management front end.
#
# ONE ORIGIN IS THE POINT. The browser loads the page and calls /api from the same
# name, so core-api's __Host- session cookie is sent and its Origin check passes with
# no CORS involved. The /api forwarding is done by the admin app itself, NOT by a
# second location here: two paths to the same API with different headers is how one
# of them quietly stops sending Origin.
#
# Nothing in this file mentions core-api. It proxies to 127.0.0.1:3400 and stops.

server {
    listen 80;
    listen [::]:80;
    server_name admin.yeyintlwin.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # NO `http2` TOKEN AND NO `http2 on;` DIRECTIVE, for the reason api.conf spells
    # out at length: `http2 on;` needs nginx >= 1.25.1 and this box runs 1.24.0, and
    # the old `listen 443 ssl http2` form reaches past its own server block and would
    # turn http2 on for every other site sharing the port.
    #
    # This file shipped once WITH `http2 on;` and the deploy caught it --
    # `[emerg] unknown directive "http2"` -- and rolled all three nginx files back.
    # The rollback worked; the copy did not. api.conf was the file being copied from
    # and it already carried this warning.
    server_name admin.yeyintlwin.com;

    ssl_certificate     /etc/letsencrypt/live/admin.yeyintlwin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.yeyintlwin.com/privkey.pem;

    # The sign-in body is two short fields. The cap keeps a hostile body off the app
    # entirely, and matches what core-api's own body reader enforces.
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;

        # EXACTLY ONE append, and it happens here. The admin app forwards this header
        # untouched, so core-api still sees a chain one entry deep and
        # TRUSTED_PROXY_HOPS stays 1 with its cross-file assertion intact. An append
        # on both sides would make the depth 2 through /api and 1 everywhere else,
        # and no single hop count would be right for both.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Origin is deliberately NOT set. core-api compares it to API_PUBLIC_ORIGIN,
        # which is this host, so it must arrive exactly as the browser sent it. A
        # proxy_set_header here would make that check pass for a forged cross-site
        # request too.
    }
}
